<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Seoul Coffee, Vinyl &amp; Food Guide</title>
    <meta name="description" content="Curated coffee shops, vinyl listening spaces, restaurants and sights in Seoul, grouped by walkable area.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Seoul Coffee, Vinyl &amp; Food Guide">
    <meta property="og:description" content="Curated coffee shops, vinyl listening spaces, restaurants and sights in Seoul, grouped by walkable area.">
    <meta name="theme-color" content="#f4f1ea">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f4f1ea'/%3E%3Ccircle cx='32' cy='32' r='21' fill='%2323211e'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23f4f1ea'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23923d36'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+TC:wght@400;600&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="data/areas.js" defer></script>
    <script src="data/stickers.js" defer></script>
    <script src="data/places.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#places">跳至店家列表</a>

    <header class="site-header">
      <div class="header-inner">
        <div>
          <p class="edition">SEOUL · KOREA / CURATED INDEX</p>
          <h1>Seoul Coffee <span>&amp;</span> Vinyl Guide</h1>
          <p class="subtitle">首爾咖啡、黑膠、餐廳與景點收藏</p>
        </div>
        <div class="record-mark" aria-hidden="true">
          <span>01</span>
        </div>
      </div>

      <nav class="area-map" aria-labelledby="area-map-title">
        <div class="area-map-head">
          <p class="area-map-kicker">AREA MAP / SEOUL</p>
          <h2 id="area-map-title">首爾中心區域分布</h2>
          <p class="area-map-note">示意地圖 — 依實際旅遊動線分群，點選可跳至該群店家</p>
          <ul class="route-legend" id="route-legend" hidden></ul>
        </div>

        <div class="area-map-body">
          <figure class="area-map-figure" id="area-map-figure">
            <svg class="area-map-shape" viewBox="0 0 1118 676" role="img" aria-label="首爾中心區域示意地圖，標示漢江、南山、北岳山與首爾各收錄區域，東至蠶室">
              <defs>
                <pattern id="map-grid" width="50" height="50" patternUnits="userSpaceOnUse">
                  <path d="M50 0 V50 H0"></path>
                </pattern>
                <pattern id="map-hill" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                  <line x1="0" y1="0" x2="0" y2="7"></line>
                </pattern>
                <clipPath id="map-frame">
                  <rect x="0" y="0" width="1118" height="676"></rect>
                </clipPath>
              </defs>

              <rect class="map-land" x="0" y="0" width="1118" height="676"></rect>
              <rect class="map-grid-fill" x="0" y="0" width="1118" height="676" fill="url(#map-grid)"></rect>

              <g clip-path="url(#map-frame)">
                <g class="map-hills">
                  <ellipse cx="505" cy="80" rx="54" ry="31" transform="rotate(-20 505 80)"></ellipse>
                  <ellipse cx="602" cy="52" rx="60" ry="28" transform="rotate(-8 602 52)"></ellipse>
                  <ellipse cx="600" cy="268" rx="58" ry="33" transform="rotate(-10 600 268)"></ellipse>
                </g>
                <g class="map-hatch" fill="url(#map-hill)">
                  <ellipse cx="505" cy="80" rx="54" ry="31" transform="rotate(-20 505 80)"></ellipse>
                  <ellipse cx="602" cy="52" rx="60" ry="28" transform="rotate(-8 602 52)"></ellipse>
                  <ellipse cx="600" cy="268" rx="58" ry="33" transform="rotate(-10 600 268)"></ellipse>
                </g>

                <path class="map-water-bank" d="M-30 134 C 60 164 112 182 176 228 C 236 272 302 331 372 362 C 440 391 472 407 540 423 C 606 437 650 428 706 412 C 760 397 778 382 830 380 C 884 378 906 392 946 404 C 1000 420 1064 431 1160 449"></path>
                <path class="map-water" d="M-30 134 C 60 164 112 182 176 228 C 236 272 302 331 372 362 C 440 391 472 407 540 423 C 606 437 650 428 706 412 C 760 397 778 382 830 380 C 884 378 906 392 946 404 C 1000 420 1064 431 1160 449"></path>
                <path class="map-water-line" d="M-30 134 C 60 164 112 182 176 228 C 236 272 302 331 372 362 C 440 391 472 407 540 423 C 606 437 650 428 706 412 C 760 397 778 382 830 380 C 884 378 906 392 946 404 C 1000 420 1064 431 1160 449"></path>
                <ellipse class="map-island" cx="374" cy="364" rx="38" ry="8" transform="rotate(23 374 364)"></ellipse>
              </g>

              <!-- 路線由 app.js 依 data/areas.js 的 ROUTES 產生，底圖本身不含任何路線 -->
              <g class="map-routes" id="map-routes"></g>

              <g class="map-label">
                <text x="420" y="464" transform="rotate(16 420 464)">漢江 HAN RIVER</text>
                <text x="600" y="272" text-anchor="middle">남산 NAMSAN</text>
                <text x="612" y="34" text-anchor="middle">북악산 BUGAKSAN</text>
              </g>

              <g class="map-compass" transform="translate(1052 62)">
                <circle r="24"></circle>
                <path class="map-compass-needle" d="M0 -17 L7 6 L0 1 L-7 6 Z"></path>
                <text y="-30" text-anchor="middle">N</text>
              </g>

              <g class="map-scale" transform="translate(946 644)">
                <path d="M0 0 H89"></path>
                <path d="M0 -6 V6 M89 -6 V6"></path>
                <text x="97" y="5">2 km</text>
              </g>
            </svg>

          </figure>

          <div class="area-map-aside">
            <ol class="area-index" id="area-index"></ol>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="toolbar" aria-label="搜尋與篩選">
        <div class="search-wrap">
          <label for="search">搜尋</label>
          <input id="search" type="search" autocomplete="off" placeholder="搜尋店名、韓文店名、分類、區域、地址、備註">
          <button id="clear-search" class="clear-search" type="button" hidden>清除搜尋</button>
        </div>

        <div class="toolbar-row">
          <div class="filters" id="category-filters" role="group" aria-label="分類篩選"></div>

          <div class="sort-control">
            <label for="sort">排序</label>
            <select id="sort">
              <option value="area">區域</option>
              <option value="name">店名</option>
            </select>
          </div>
        </div>

        <div class="filters filters-sub" id="sub-filters" role="group" aria-label="次分類篩選" hidden></div>
      </section>

      <section class="results-summary" aria-live="polite" aria-atomic="true">
        <p id="result-count">27 places</p>
        <p id="active-area" class="active-area" hidden></p>
      </section>

      <div id="places" class="places" tabindex="-1"></div>

      <section id="empty-state" class="empty-state" hidden>
        <p class="empty-kicker">NO MATCHES</p>
        <h2>找不到符合條件的店家</h2>
        <p>試著縮短關鍵字，或清除部分篩選條件。</p>
        <button id="reset-filters" type="button">顯示全部店家</button>
      </section>
    </main>

    <footer>
      <p>Seoul Coffee &amp; Vinyl Guide</p>
      <p>地址與營業資訊可能異動，出發前請透過 NAVER Map 再次確認。</p>
    </footer>

    <noscript>此網站需要 JavaScript 才能顯示區域地圖、店家資料與篩選功能。</noscript>
  </body>
</html>
